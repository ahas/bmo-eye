# bmo-eye as a tool of the tool host (docs/plan.md, 「The tool」): one entry a mode, each answered by the
# release's binary's `tool` word with the look the service made. The deployment places the binary, this
# manifest and the schemas in one folder and registers it as this service's own.

[tool]
name = "eye"
protocol = 1
language = "rust"
build = 'cp bin/bmo-eye "$BMO_TOOL_OUT/"'
check = "cargo test --workspace"
run = ["bmo-eye", "tool"]
timeout = 1800

[[entry]]
namespace = "eye"
name = "see"
title = "See"
description = "Look at one or more images — a photo, a screenshot, a chart — and answer a question about them, through the platform's vision unit."
manual = "docs/tool-see.md"
input = "tool/see.json"
output = "tool/look.json"
hints = { read_only = true, open_world = true }
capabilities = ["room.tools"]
timeout = 900

[[entry]]
namespace = "eye"
name = "read"
title = "Read"
description = "Read a document — a scan, a PDF page, a table — and answer its text, page by page, through the platform's vision unit."
manual = "docs/tool-read.md"
input = "tool/read.json"
output = "tool/look.json"
hints = { read_only = true, open_world = true }
capabilities = ["room.tools"]
timeout = 900

[[entry]]
namespace = "eye"
name = "watch"
title = "Watch"
description = "Look at a video — a file, an address or a YouTube link — answer a question about it, with what is said in it."
manual = "docs/tool-watch.md"
input = "tool/watch.json"
output = "tool/look.json"
hints = { read_only = true, open_world = true }
capabilities = ["room.tools"]
timeout = 1800
