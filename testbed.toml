# How bmo-testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "bmo-eye"

[test]
# The workspace's crates and the repository's own tests under tests/, which walk the routes against a
# stand-in local engine node.
languages = ["cargo"]

[check]
quick = ["layout", "dependencies", "korean", "cargo-profile", "shared-versions"]
korean_ledger = "korean-ledger.json"

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# No Cargo step is declared. The testbed's own Cargo workspace check formats and lints every member, every target
# compiled, through its Cargo verb in the shared build directory, wherever a change marks a crate, and the change
# check compiles every crate a change marks; the suite runs every crate's tests, the root package's harness with
# them, so a change that marks no crate has no Rust to judge.

[build]
# The release's binary, built from the workspace's `eye-server` crate.
binaries = ["bmo-eye"]

# The service's own deploy tree, the shared data root its settings and store stand under, the unit a deployment
# restarts and watches, and the health it waits on (docs/engines.md, 「Where the vision unit stands」).
[deploy]
root = "~/.local/share/bmo-eye"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.toml", target = "eye/settings.toml" }]
units = ["deploy/*.service"]
health = "~/.local/share/bmo-eye/deploy/bin/bmo-eye health --settings ~/.local/share/bmo-eye/deploy/settings.toml"

# The noun on the path: a link to the deploy tree's own binary, so the next release's binary is what a shell
# line runs and a pruned release leaves nothing dangling.
[[deploy.step]]
id = "link-command"
phase = "before-flip"
command = '''
set -eu
bmo_dir="$(dirname "$(command -v bmo)")"
ln -sfn "$HOME/.local/share/bmo-eye/deploy/bin/bmo-eye" "$bmo_dir/bmo-eye"
'''

# The repository's tool placed with the tool host once the service answers: the release's binary, its manifest
# and its schemas as one folder, registered as this service's own (docs/plan.md, 「The tool」).
[[deploy.step]]
id = "register-tools"
phase = "after-health"
command = '''
set -eu
bmo pocket put . --service bmo-eye --allow room.tools
'''
