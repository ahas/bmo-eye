# How bmo-testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "bmo-eye"

[test]
# The workspace's crates and the repository's own tests under tests/, which walk the routes against a
# stand-in Lab-arena node.
languages = ["cargo"]

[check]
quick = ["layout", "dependencies", "korean"]
korean_ledger = "korean-ledger.json"

[[check.step]]
id = "check"
command = "cargo check --workspace --all-targets"
lane = "wide"

[[check.step]]
id = "test"
command = "cargo test --workspace"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"
