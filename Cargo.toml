# The workspace: the crates the vision unit is built from under `crates/`, and the repository's own package
# at the root, which holds the tests that span them. The unit serves one API (`docs/api.md`) and carries no
# model of its own (`docs/engines.md`).
[workspace]
members = ["crates/client", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.1.0-rev.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive", "env"] }
futures-util = "0.3.34"
pulldown-cmark = { version = "0.13.0", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.9"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-stream = "0.1.17"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
tower-http = { version = "0.6.6", default-features = false, features = ["fs"] }
url = "2.5.4"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"

[package]
name = "eye-checks"
description = "The repository's tests: the checks that span every crate and a document."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
axum.workspace = true
base64.workspace = true
bmo-eye-client = { path = "crates/client" }
eye-server = { path = "crates/server" }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
